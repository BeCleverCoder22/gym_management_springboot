spring.application.name=gym-management
spring.profiles.default=dev

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gym_management}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

app.secret-key=${JWT_SECRET}
app.expiration-time=${JWT_EXPIRATION:900000}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}
app.time-zone=${APP_TIME_ZONE:UTC}
app.subscription.reconciliation-cron=${SUBSCRIPTION_RECONCILIATION_CRON:0 0 1 * * *}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=Gym Management API
info.app.description=REST API for gym operations

logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:WARN}
